# Observability for the published MVP, run locally (allowed by the brief):
#   docker compose -f devsecops/monitoring/public/compose.yaml up -d
#   Prometheus http://localhost:9091   Grafana http://localhost:3000 (anonymous viewer, dashboard pre-loaded)
services:
  prometheus:
    image: prom/prometheus:v3.2.1
    ports: ["127.0.0.1:9091:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../alerts.yml:/etc/prometheus/alerts.yml:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  grafana:
    image: grafana/grafana:11.6.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/acolhe.json
    volumes:
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
      - ./grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/acolhe.yaml:ro
      - ../grafana-dashboard.json:/var/lib/grafana/dashboards/acolhe.json:ro
    depends_on: [prometheus]
    security_opt: ["no-new-privileges:true"]
